name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # All three: the in-app updater runs a shell helper on macOS/Linux and a
    # PowerShell helper on Windows, and test/self-update.test.js runs them for real.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm test
        env:
          # The tests never start Electron, and npm ci skipped its binary. Without this,
          # require('electron') downloads it lazily in every test file that loads it, and
          # those parallel downloads race (seen on Windows: "failed to create directory").
          ELECTRON_OVERRIDE_DIST_PATH: ${{ runner.temp }}
      - name: Syntax check source files
        shell: bash
        run: for f in src/*.js src/ui/*.js; do node --check "$f"; done
